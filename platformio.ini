[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip ;added this to avoide errors with memory
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = homespan/HomeSpan@^2.1.1
board_build.partitions = no_ota.csv ;add this to avoide the memmory errors
